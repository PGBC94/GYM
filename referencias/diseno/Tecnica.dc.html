<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Técnica</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0d1116}
a{color:#f08a3a}a:hover{color:#ffa65e}
button{font:inherit;cursor:pointer}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
@keyframes poseUp{0%,42%{opacity:1}50%,92%{opacity:.12}100%{opacity:1}}
@keyframes poseDown{0%,42%{opacity:.12}50%,92%{opacity:1}100%{opacity:.12}}
.pose-up{animation:poseUp 3.2s ease-in-out infinite}
.pose-down{animation:poseDown 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pose-up,.pose-down{animation:none}.pose-down{opacity:.3}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0b0e12; color: #e8edf2; font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; line-height: 1.4; overflow: hidden">
<div style="height: 32px; flex-shrink: 0"></div>
<section role="dialog" aria-label="Técnica: press inclinado con mancuernas" style="flex: 1; min-height: 0; background: #1b222b; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 5px; border-radius: 3px; background: #3a4756"></span></div>
<div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #98a5b4">Banco ajustable a 30°</div>
<h1 style="margin: 4px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase">Press inclinado con mancuernas</h1>
</div>
<a href="Entreno.dc.html" aria-label="Cerrar" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: #252e39; color: #e8edf2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<figure style="margin: 0; background: #161c23; border: 1px solid #2a3440; border-radius: 18px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px">
<svg width="100%" height="210" viewBox="0 0 200 150" role="img" aria-label="Animación: brazos estirados arriba y bajada hasta el pecho">
<line x1="10" y1="140" x2="190" y2="140" stroke="#33404e" stroke-width="1.5"></line>
<line x1="90" y1="86" x2="90" y2="140" stroke="#34404d" stroke-width="4"></line>
<line x1="130" y1="110" x2="130" y2="140" stroke="#34404d" stroke-width="4"></line>
<line x1="70" y1="68" x2="126" y2="108" stroke="#3a4756" stroke-width="8" stroke-linecap="round"></line>
<line x1="126" y1="108" x2="160" y2="108" stroke="#3a4756" stroke-width="8" stroke-linecap="round"></line>
<path d="M76 60L128 98L160 96L164 136L174 136" fill="none" stroke="#e6ecf2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="66" cy="49" r="8" fill="#e6ecf2"></circle>
<g class="pose-up">
<path d="M82 64L88 40L92 16" fill="none" stroke="#e6ecf2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="80" y="11" width="24" height="9" rx="3" fill="#f08a3a"></rect>
</g>
<g class="pose-down">
<path d="M82 64L70 86L86 58" fill="none" stroke="#e6ecf2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="74" y="51" width="24" height="9" rx="3" fill="#f08a3a"></rect>
</g>
<path d="M118 54V22M113 28l5-6 5 6M113 48l5 6 5-6" fill="none" stroke="#f08a3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<figcaption style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #98a5b4">
<span>Vista lateral</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #e8edf2">Baja 2-3 s · Sube 1 s</span>
</figcaption>
</figure>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #98a5b4">Trabaja</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="padding: 6px 12px; border-radius: 999px; background: #3a2414; color: #ffb27a; font-weight: 600; font-size: 14px">Pecho alto</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #252e39; color: #c5ced8; font-weight: 500; font-size: 14px">Hombro frontal</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #252e39; color: #c5ced8; font-weight: 500; font-size: 14px">Tríceps</span>
</div>
</div>

<div role="tablist" aria-label="Guía" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #12171d; border-radius: 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<li style="display: flex; gap: 12px; align-items: flex-start">
<span style="{{it.badge}}">{{it.mark}}</span>
<span style="font-size: 16px; line-height: 1.45; padding-top: 3px">{{it.text}}</span>
</li>
</sc-for>
</ol>

<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: #12171d">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8fb2d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"></path></svg>
<p style="margin: 0; font-size: 15px; line-height: 1.45"><b style="color: #8fb2d6">Respiración:</b> inspira al bajar, suelta el aire al empujar.</p>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: "steps" };
  }
  renderVals() {
    var self = this;
    var tab = this.state.tab;
    var data = {
      setup: ["Banco a unos 30° (dos o tres posiciones por encima del plano).", "Omóplatos juntos y apoyados, pies firmes en el suelo."],
      steps: ["Empieza con los brazos estirados por encima de los ojos.", "Baja en 2-3 segundos hasta la parte alta del pecho, codos a 45°.", "Empuja hacia arriba soltando el aire."],
      errors: ["Inclinar demasiado el banco: pasa a ser un ejercicio de hombro.", "Abrir los codos en cruz.", "Despegar los glúteos del asiento."]
    };
    var defs = [["setup", "Colocación"], ["steps", "Ejecución"], ["errors", "Errores"]];
    var tabBase = "min-height:44px;border:0;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;";
    var isErr = tab === "errors";
    var badgeBase = "flex-shrink:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;";
    return {
      tabs: defs.map(function (d) {
        var sel = d[0] === tab;
        return {
          label: d[1],
          sel: sel,
          style: tabBase + (sel ? "background:#252e39;color:#e8edf2" : "background:transparent;color:#98a5b4"),
          pick: function () { self.setState({ tab: d[0] }); }
        };
      }),
      items: data[tab].map(function (t, i) {
        return {
          text: t,
          mark: isErr ? "!" : String(i + 1),
          badge: badgeBase + (isErr ? "background:#3d1f1a;color:#ef7a68" : "background:#3a2414;color:#ffb27a")
        };
      })
    };
  }
}
</script>
</body>
</html>
